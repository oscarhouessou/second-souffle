# Construit et publie l'image du service « mcp_catalog » dans Artifact Registry.
#   gcloud builds submit --config .cloudbuild/mcp_catalog.yaml --substitutions=_REGION=europe-west1 .
substitutions:
  _REGION: europe-west1
  _REPO: second-souffle
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "mcp_catalog/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-catalog:$BUILD_ID", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-catalog:latest", "."]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-catalog:$BUILD_ID"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcp-catalog:latest"
options:
  logging: CLOUD_LOGGING_ONLY
