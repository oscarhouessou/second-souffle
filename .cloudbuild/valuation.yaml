# Construit et publie l'image du service « valuation » dans Artifact Registry.
#   gcloud builds submit --config .cloudbuild/valuation.yaml --substitutions=_REGION=europe-west1 .
substitutions:
  _REGION: europe-west1
  _REPO: second-souffle
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "valuation/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/valuation:$BUILD_ID", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/valuation:latest", "."]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/valuation:$BUILD_ID"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/valuation:latest"
options:
  logging: CLOUD_LOGGING_ONLY
